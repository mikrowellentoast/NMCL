config-version: 3

plugin:
  enabled: true

combat:
  duration: 30s
  creative-mode: false
  retaliation:
    enabled: false
    window: 10s
    tag-attacker-immediately: true
  grace-period:
    join: 5s
    respawn: 3s
    mutual: true
  damage-sources:
    melee: true
    projectiles: true
    arrows: true
    tridents: true
    other-player-caused-damage: true

display:
  type: ACTION_BAR
  action-bar:
    enabled: true
  boss-bar:
    enabled: false
  title:
    enabled: false

commands:
  mode: BLACKLIST
  list:
    - home
    - spawn
    - warp
    - tpa

# true means this teleport type is allowed while combat tagged.
teleport:
  portals: false
  ender-pearls: false

worlds:
  disabled:
    - world_the_end

safe-zones:
  enabled: false
  remove-combat-on-entry: false

punishment:
  enabled: true
  actions:
    - type: KILL

integrations:
  placeholder-api: true
  worldguard:
    enabled: false
    safe-regions: []

debug:
  enabled: false
